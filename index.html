<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0">
        <title>Task Manager</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="auth">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Passwort">

    <button id="loginButton">Login</button>
    <button id="registerButton">Registrieren</button>
</div>

<div id= "app" style="display:none" class="container">
        <h1>Task Manager</h1>
        <button id="logoutButton">Logout</button>

        <div class="input-row">
        <input type="text" placeholder="Neue Aufgabe" id="taskTitle">
        <button id="addButton">Hinzufügen</button>
        </div>
        <div class="search">
    <input type="text" id="searchInput" placeholder="Aufgabe suchen">
    <button id="searchButton">Suchen</button>
        </div>
        <div class="filters">
    <button id="allButton">Alle</button>
    <button id="openButton">Offen</button>
    <button id="completedButton">Erledigt</button>
        </div>
    <select id="sortSelect">
    <option value="newest">Neueste zuerst</option>
    <option value="oldest">Älteste zuerst</option>
    <option value="az">A–Z</option>
    <option value="za">Z–A</option>
    </select>
        <ul id="taskList"></ul>
        </div>
        <script src="script.js"></script>
    </body>
</html>
